apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-controller
  namespace: {{ .Release.Namespace }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: discovery
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: discovery
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: discovery
  apiGroup: rbac.authorization.k8s.io
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: network-controller
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: network-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: network-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discovery
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - 'mpc.bosch.com'
    resources:
      - networks
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - 'networking.istio.io'
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: network-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - mpc.bosch.com
    resources:
      - networks
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.istio.io
    resources:
      - gateways
      - virtualservices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knative-serving
  namespace: {{ .Release.Namespace }}
{{- if .Values.ephemeral.image.pullSecrets }}
imagePullSecrets:
  {{- range .Values.ephemeral.image.pullSecrets }}
  - name: {{ . }}
  {{- end}}
{{- end}}
