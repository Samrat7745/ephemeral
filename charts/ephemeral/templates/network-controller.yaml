apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ephemeral.fullname" . }}-network-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: {{ include "ephemeral.fullname" . }}-network-controller
  template:
    metadata:
      labels:
        name: {{ include "ephemeral.fullname" . }}-network-controller
    spec:
      serviceAccountName: network-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.networkController.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.networkController.image.pullSecrets }}
        - name: {{ . }}
        {{- end}}
      {{- end}}
      containers:
      - name: "{{ .Chart.Name }}-network-controller"
        image: "{{ .Values.networkController.image.registry }}/{{ .Values.networkController.image.repository }}:{{ .Values.networkController.image.tag }}"
        imagePullPolicy: {{ .Values.networkController.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: WATCH_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: OPERATOR_NAME
            value: "network-controller"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
            - name: config-volume
              mountPath: /etc/config
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "ephemeral.fullname" . }}-network-controller-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ephemeral.fullname" . }}-network-controller-config
data:
  config.json: |-
    {
      "tlsEnabled": {{ .Values.tls.enabled }},
      "tlsSecret": "{{ .Values.tls.secret }}"
    }
