name: Build and test Service
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      service: ${{ steps.filter.outputs.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check whether service (w/o chart) codebase is affected
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            service:
              - '!((ephemeral-java-client|charts)/**)/**'
  service-test:
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.service == 'true' }}
    env:
      GOPATH: ${{ github.workspace }}
      GO111MODULE: on
      REGISTRY: ghcr.io
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/go.mod
          cache-dependency-path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/go.sum
      - name: Perform Build
        run: |
          go build ./...
      - name: Perform Tests
        run: |
          go test -p 2 ./... -coverprofile coverage.txt.tmp && cat coverage.txt.tmp | grep -Ev "fake|helper" > coverage.txt
      - name: Check Coverage Floor
        run: |
          scripts/check-coverage.sh coverage.txt
      - name: Fuzz Smoke Tests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          # Short runs on the seed corpora (testdata/fuzz) plus 15s of mutation per target.
          go test -run='^$' -fuzz='^FuzzGetUserFromAuthHeader$' -fuzztime=15s -parallel 2 ./pkg/ephemeral
          go test -run='^$' -fuzz='^FuzzActivationBody$' -fuzztime=15s -parallel 2 ./pkg/ephemeral
          go test -run='^$' -fuzz='^FuzzNewPortsState$' -fuzztime=15s -parallel 2 ./pkg/discovery
          go test -run='^$' -fuzz='^FuzzEventUnmarshal$' -fuzztime=15s -parallel 2 ./pkg/discovery/transport/proto
      - name: Publishing Coverage
        uses: codecov/codecov-action@v5
        with:
          name: codecov
          files: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}/coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: service
  # This is required to allow for setting the test job as required in scenarios
  # where the tests are not actually run, e.g., when the helm chart is updated.
  service-test-status:
    runs-on: ubuntu-24.04
    needs: service-test
    if: '!cancelled()' # Makes the job run regardless whether 'test' succeeds or not but allows for cancellation
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.service-test.result, 'failure')) }}
        run: exit 0
      - name: Tests failed
        if: ${{ contains(needs.service-test.result, 'failure') }}
        run: exit 1
